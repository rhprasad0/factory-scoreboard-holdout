[project]
name = "factory-scoreboard-holdout"
version = "0.1.0"
description = "Black-box oracles for the factory-scoreboard software factory"
requires-python = ">=3.13"
dependencies = ["httpx>=0.27", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tasks"]
# Every task can have a test_health.py without their module names colliding.
addopts = "--import-mode=importlib"
